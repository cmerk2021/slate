# Local mock servers for development without real accounts.
#   docker compose -f docker-compose.dev.yml up -d
#
# GreenMail (IMAP/SMTP/POP3) — any login is accepted (user: demo@slate.test / password: demo)
#   IMAP:  localhost:3143 (no TLS — pick security "None" in the wizard)
#   SMTP:  localhost:3025
#   POP3:  localhost:3110
#
# Radicale (CalDAV/CardDAV) — user: demo / password: demo
#   DAV:   http://localhost:5232/
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    container_name: slate-greenmail
    restart: unless-stopped
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose
    ports:
      - '3025:3025' # SMTP
      - '3110:3110' # POP3
      - '3143:3143' # IMAP

  radicale:
    image: tomsquest/docker-radicale:3.3.1.0
    container_name: slate-radicale
    restart: unless-stopped
    ports:
      - '5232:5232'
    volumes:
      - radicale-data:/data
      - ./dev/radicale.conf:/config/config:ro
      - ./dev/radicale.users:/config/users:ro

volumes:
  radicale-data:
