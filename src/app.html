<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#1c1917" />
		<script>
			(() => {
				try {
					const m = document.cookie.match(/(?:^|; )slate_theme=([^;]*)/);
					const v = m ? decodeURIComponent(m[1]) : '';
					const [theme, accent] = v.split('|');
					let t = theme || 'zen-dark';
					if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'paper-light' : 'zen-dark';
					document.documentElement.dataset.theme = t;
					if (accent) document.documentElement.style.setProperty('--accent-h', accent);
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
